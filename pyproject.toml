[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglr"
version = "0.2.0"
description = "Tiny heterogeneous experts with learned discrete recurrence"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Logan Hallee" }]
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
]

[project.scripts]
sglr-train = "scripts.train_mnist:main"
sglr-sweep = "scripts.run_mnist_sweep:main"
sglr-figures = "scripts.analyze_mnist:main"
sglr-round1 = "scripts.run_round1:main"

[tool.setuptools.packages.find]
include = ["sglr*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
